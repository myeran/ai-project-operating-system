<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Project Operating System</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f3f5f7; color: #17202a; }
    main { max-width: 1080px; margin: 32px auto; padding: 0 18px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 18px; }
    .card { background: white; border: 1px solid #dce2e7; border-radius: 14px; box-shadow: 0 8px 28px #17202a12; overflow: hidden; }
    h1 { font-size: 24px; margin: 0; padding: 22px 24px; border-bottom: 1px solid #e7ebef; }
    #history { min-height: 420px; max-height: 62vh; overflow-y: auto; padding: 20px; }
    .message { white-space: pre-wrap; padding: 12px 15px; margin: 10px 0; border-radius: 12px; line-height: 1.55; }
    .user { background: #e8f0fe; margin-right: 12%; }
    .system { background: #f1f3f4; margin-left: 12%; }
    .error { background: #fff0f0; color: #a61b1b; }
    form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid #e7ebef; }
    input { flex: 1; font-size: 16px; padding: 12px 14px; border: 1px solid #c8d0d8; border-radius: 9px; }
    button { border: 0; border-radius: 9px; background: #2563eb; color: white; padding: 0 22px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .hint { color: #5b6773; font-size: 14px; margin: 12px 4px; }
    .knowledge { background: white; border: 1px solid #dce2e7; border-radius: 14px; padding: 18px; box-shadow: 0 8px 28px #17202a12; }
    .knowledge h2 { margin: 0 0 8px; font-size: 19px; }
    .knowledge-item { border-top: 1px solid #e7ebef; padding: 14px 0; }
    .knowledge-item:first-of-type { border-top: 0; }
    .question { font-weight: 650; margin-bottom: 8px; }
    textarea, select { width: 100%; box-sizing: border-box; font: inherit; padding: 9px; border: 1px solid #c8d0d8; border-radius: 8px; margin: 4px 0 8px; }
    textarea { min-height: 70px; resize: vertical; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions button { padding: 8px 12px; font-size: 14px; }
    .secondary { background: #475569; }
    .status { font-size: 13px; color: #5b6773; margin: 6px 0; }
    .navigator { margin-top: 18px; border-top: 1px solid #e7ebef; padding-top: 16px; }
    .navigator-step { padding: 8px 10px; margin: 6px 0; border-radius: 8px; background: #f7f8fa; }
    .navigator-step.current { background: #e8f0fe; border-right: 4px solid #2563eb; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="layout">
      <section class="card">
        <h1>AI Project Operating System</h1>
        <div id="history" aria-live="polite">
          <div class="message system">שלום. ספר לי בחופשיות מה תרצה לבנות או להשיג, ואני אעזור לך להתקדם צעד־צעד.</div>
        </div>
        <form id="chat-form">
          <input id="message" autocomplete="off" placeholder="כתוב הודעה..." aria-label="הודעה">
          <button id="send" type="submit">שלח</button>
        </form>
      </section>
      <aside class="knowledge" aria-labelledby="knowledge-title">
        <h2 id="knowledge-title">סיכום ביניים</h2>
        <div id="knowledge-status" class="status">התחל פרויקט כדי לטעון את סיכום הידע.</div>
        <div class="actions">
          <button id="copy-summary" class="secondary" type="button">העתק סיכום להתייעצות</button>
          <button id="save-exit" type="button">שמור וצא</button>
        </div>
        <div id="knowledge-items"></div>
        <section class="navigator" aria-labelledby="navigator-title">
          <h2 id="navigator-title">מפת הפרויקט</h2>
          <div id="navigator-status" class="status">התחל פרויקט כדי להציג את שלבי הפרויקט.</div>
          <button id="show-navigator" type="button">הצג מפת פרויקט</button>
          <div id="navigator-steps"></div>
        </section>
      </aside>
    </div>
    <div class="hint">החיבור מקומי בלבד: Chat → MCP → Runtime API → Runtime</div>
  </main>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const history = document.getElementById('history');
    const send = document.getElementById('send');
    const itemsNode = document.getElementById('knowledge-items');
    const knowledgeStatus = document.getElementById('knowledge-status');
    const navigatorStatus = document.getElementById('navigator-status');
    const navigatorSteps = document.getElementById('navigator-steps');
    let knowledge = null;
    function add(text, kind) {
      const node = document.createElement('div');
      node.className = `message ${kind}`;
      node.textContent = text;
      history.appendChild(node);
      history.scrollTop = history.scrollHeight;
    }
    function label(status) { return ({open: 'פתוח', approved: 'מאושר', needs_update: 'דורש עדכון'})[status] || status; }
    function phaseLabel(status) { return ({completed: 'הושלם', current: 'נוכחי', pending: 'ממתין'})[status] || status; }
    function renderNavigator(data) {
      navigatorStatus.textContent = `שלב נוכחי: ${data.current_phase || 'לא ידוע'} · Skill נוכחי: ${data.current_skill || 'לא רשום'} · ${data.next_action || ''}`;
      navigatorSteps.innerHTML = '';
      (data.steps || []).forEach(step => {
        const node = document.createElement('div'); node.className = `navigator-step ${step.status === 'current' ? 'current' : ''}`;
        const missing = (step.missing || []).length ? ` · חסר: ${step.missing.join(', ')}` : '';
        node.textContent = `${step.phase} — ${phaseLabel(step.status)} · ${step.responsible_skill || 'אין Skill רשום'}${missing}`;
        navigatorSteps.appendChild(node);
      });
    }
    function renderKnowledge(summary) {
      knowledge = summary;
      const counts = summary.counts || {};
      knowledgeStatus.textContent = `הושלם: ${counts.approved || 0} · פתוח: ${counts.open || 0} · דורש עדכון: ${counts.needs_update || 0} · ${summary.next_step || ''}`;
      itemsNode.innerHTML = '';
      (summary.items || []).forEach(item => {
        const wrapper = document.createElement('div'); wrapper.className = 'knowledge-item';
        wrapper.innerHTML = `<div class="question"></div><div class="status"></div><textarea aria-label="תשובה"></textarea><select aria-label="סטטוס"><option value="open">פתוח</option><option value="approved">מאושר</option><option value="needs_update">דורש עדכון</option></select><div class="actions"><button type="button">שמור תשובה</button></div>`;
        wrapper.querySelector('.question').textContent = item.question;
        wrapper.querySelector('.status').textContent = `סטטוס: ${label(item.status)}`;
        wrapper.querySelector('textarea').value = item.answer || '';
        wrapper.querySelector('select').value = item.status || 'open';
        wrapper.querySelector('button').addEventListener('click', async () => {
          const button = wrapper.querySelector('button'); button.disabled = true;
          try { const response = await fetch('/api/update-knowledge', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({item_id:item.id, answer:wrapper.querySelector('textarea').value, status:wrapper.querySelector('select').value})}); const body = await response.json(); if (!response.ok) throw new Error(body.error || 'שמירה נכשלה'); await loadKnowledge(); } catch (error) { add(error.message, 'system error'); } finally { button.disabled = false; }
        });
        itemsNode.appendChild(wrapper);
      });
    }
    async function loadKnowledge() { const response = await fetch('/api/knowledge-summary', {method:'POST'}); if (response.ok) renderKnowledge(await response.json()); }
    async function loadNavigator() { const response = await fetch('/api/project-navigator', {method:'POST'}); if (response.ok) renderNavigator(await response.json()); }
    document.getElementById('show-navigator').addEventListener('click', async () => {
      const button = document.getElementById('show-navigator');
      button.disabled = true;
      try { await loadNavigator(); } finally { button.disabled = false; }
    });
    function consultationText() { return (knowledge?.items || []).map((item, i) => `${i + 1}. שאלה: ${item.question}\n   תשובה נוכחית: ${item.answer || '(אין תשובה עדיין)'}\n   סטטוס: ${label(item.status)}`).join('\n\n'); }
    async function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const helper = document.createElement('textarea');
      helper.value = text; helper.setAttribute('readonly', '');
      helper.style.position = 'fixed'; helper.style.opacity = '0';
      document.body.appendChild(helper); helper.select(); helper.setSelectionRange(0, helper.value.length);
      const copied = document.execCommand('copy');
      helper.remove();
      if (!copied) throw new Error('הדפדפן חסם את ההעתקה. אפשר לסמן ולהעתיק את הטקסט ידנית.');
    }
    document.getElementById('copy-summary').addEventListener('click', async () => {
      const button = document.getElementById('copy-summary');
      button.disabled = true;
      try {
        if (!knowledge) await loadKnowledge();
        const text = consultationText();
        if (!text) throw new Error('אין עדיין סיכום להעתקה. התחל פרויקט ונסה שוב.');
        await copyToClipboard(text);
        knowledgeStatus.textContent = 'הסיכום הועתק לצ׳אט.';
      } catch (error) {
        knowledgeStatus.textContent = error.message || 'ההעתקה נכשלה.';
      } finally { button.disabled = false; }
    });
    document.getElementById('save-exit').addEventListener('click', async () => { const response = await fetch('/api/save-checkpoint', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({items:knowledge?.items || []})}); const body = await response.json(); knowledgeStatus.textContent = response.ok ? 'נשמר. אפשר לחזור ולהמשיך מהנקודה האחרונה.' : (body.error || 'השמירה נכשלה'); if (response.ok) renderKnowledge(body.knowledge_summary); });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      add(message, 'user'); input.value = ''; send.disabled = true;
      try {
        const response = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message}) });
        const body = await response.json();
        add(response.ok ? body.reply : (body.error || 'אירעה שגיאה'), response.ok ? 'system' : 'system error');
        if (response.ok) {
          if (body.knowledge_summary) renderKnowledge(body.knowledge_summary);
          else await loadKnowledge();
          await loadNavigator();
        }
      } catch (error) {
        add('שרת הצ׳אט המקומי אינו זמין.', 'system error');
      } finally { send.disabled = false; input.focus(); }
    });
  </script>
</body>
</html>
